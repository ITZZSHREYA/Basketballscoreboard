<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Basketball Scoreboard</title>
 <link rel="stylesheet" href="styles.css">
</head>
<body>
 <h1>BASKETBALL SCOREBOARD</h1>
 <button class="dark-mode-button" onclick="toggleDarkMode()">🌙</button>
 <div class="teams-container">
  <div class="team home">
   <h1 id="home-team-name">HOME</h1>
    <span class="score">0</span>
   <!-- <span class="score blink">0</span> -->
   <div class="points-buttons">
    <button class="point-button" data-value="1"> +1 </button>
    <button class="point-button" data-value="2"> +2 </button>
    <button class="point-button" data-value="3"> +3 </button>
    <button class="reset-button" onclick="resetPoints('home')">Reset</button>
   </div>
   <div class="team-controls">
    <input type="text" id="home-team-input" placeholder="Enter New Name">
    <button class="update-team-button" onclick="updateTeamName('home')">Update Team Name</button>
   </div>
  </div>
  <div class="team guest">
   <h1 id="guest-team-name">GUEST</h1>
   <span class="score">0</span>
   <div class="points-buttons">
    <button class="point-button" data-value="1"> +1 </button>
    <button class="point-button" data-value="2"> +2 </button>
    <button class="point-button" data-value="3"> +3 </button>
    <button class="reset-button" onclick="resetPoints('guest')">Reset</button>
   </div>
   <div class="team-controls">
    <input type="text" id="guest-team-input" placeholder="Enter New Name">
    <button class="update-team-button" onclick="updateTeamName('guest')">Update Team Name</button>
   </div>
  </div>
 </div>
 <div class="timer">
   <h3>TIMER</h3>
   <span class="time">12:00</span>
 </div>
 <div class="controls">
   <button class="control-button" id="start">START</button>
   <button class="control-button" id="stop">STOP</button>
   <button class="control-button" id="pause">PAUSE</button>
   <button class="control-button" id="reset">RESET</button>
 </div>
 <br>

    <div class="buzz">
        <button class="buzz" style="background-color: aqua;" onclick="playBuzzer()">BUZZER</button>
    </div>
    


 <script src="script.js"></script>
</body>
</html>
